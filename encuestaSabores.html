<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Encuesta de Sabores</title>
</head>
<body>

<div class="container">
    <h1>Preferencias</h1>
    <form action="https://formsubmit.co/apm05772@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">

        <div class="group">
            <label for="name">Nombre</label>
            <input type="text" id="name" name="Nombre" placeholder="Tu nombre" required>
        </div>

        <div class="group">
            <label for="flavor">Que tipo de snacks te gustaria tener mas en tu despensa?</label>
            <select id="flavor" name="Preferencia_Dulce_Salado">
                <option value="dulce">Dulces</option>
                <option value="salado">Salados</option>
                <option value="ambos">Ambos, no me importa</option>
            </select>
        </div>

        <div class="group">
            <label for="dessert">Cual es tu postre favorito?</label>
            <input type="text" id="dessert" name="Postre_Favorito" placeholder="Ej: Torta de chocolate">
        </div>

        <div class="group">
            <label for="snacks">Snacks que nunca faltarian en tu despensa</label>
            <textarea id="snacks" name="Snacks_Favoritos" rows="3" placeholder="Papas fritas, gomitas..."></textarea>
        </div>

        <div class="group">
            <label for="chocolate">Tipo de chocolate preferido?</label>
            <select id="chocolate" name="Tipo_Chocolate">
                <option value="leche">Con leche</option>
                <option value="amargo">Amargo / Negro</option>
                <option value="blanco">Blanco</option>
            </select>
        </div>

        <div class="group">
            <label for="soda">Que sabor de gaseosa te gusta?</label>
            <select id="soda" name="Sabor_Gaseosa">
                <option value="cola">Cola</option>
                <option value="limon">Limon</option>
                <option value="naranja">Naranja</option>
                <option value="piña">Piña</option>
                <option value="frutal">Frutal</option>
                <option value="todos">Todos</option>
            </select>
        </div>

        <div class="group">
            <label for="snacksMalos">Que tipos/sabores de snacks NO te gustan?</label>
            <textarea id="snacks" name="Snacks_Malos" rows="3" placeholder="Regaliz, Caramelos duros..."></textarea>
        </div>

        <button type="submit">Enviar respuestas</button>
    </form>
</div>

</body>
</html>
